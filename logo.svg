<?xml version="1.0" encoding="UTF-8"?>
<!--
  Soul in Motion — primary mark
  Möbius monogram (concept 01) — single ribbon shaped like an S that loops
  Designed in Claude Design, locked 2026-05-15.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-label="Soul in Motion">
  <defs>
    <linearGradient id="sim-mobius" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8A04A"/>
      <stop offset="100%" stop-color="#3D8FE0"/>
    </linearGradient>
  </defs>
  <path
    d="M 50 60 C 50 30, 110 30, 110 70 C 110 110, 50 110, 50 150 C 50 190, 110 190, 170 160 C 200 145, 200 110, 170 100 C 130 88, 90 110, 90 150"
    stroke="url(#sim-mobius)"
    stroke-width="14"
    stroke-linecap="round"
    fill="none"/>
  <circle cx="135" cy="58" r="9" fill="#0A0B10"/>
</svg>
